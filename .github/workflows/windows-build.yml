name: Windows Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release metadata
        shell: pwsh
        run: ./scripts/check-release-version.ps1 -Tag "${{ github.ref_name }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend code
        working-directory: frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Smoke test frontend build
        working-directory: frontend
        run: npm run smoke

      - name: Run Go vet
        shell: pwsh
        run: ./scripts/check-go.ps1 -Command vet

      - name: Run Go tests
        shell: pwsh
        run: ./scripts/check-go.ps1 -Command test

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run Go vulnerability check
        shell: pwsh
        run: ./scripts/check-go.ps1 -Command govulncheck

      - name: Check source file line limits
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check-line-limit.ps1

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows executable
        run: wails build -clean

      - name: Sign Windows executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: ./scripts/sign-windows-artifacts.ps1 -ArtifactPattern "build\bin\OmniMailDesktop.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content wails.json | ConvertFrom-Json).info.productVersion
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" build\windows\OmniMailDesktop.iss

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        run: ./scripts/sign-windows-artifacts.ps1

      - name: Generate installer checksum
        shell: pwsh
        run: ./scripts/write-installer-checksum.ps1

      - name: Generate update manifest
        shell: pwsh
        run: ./scripts/write-update-manifest.ps1

      - name: Check update manifest
        shell: pwsh
        run: ./scripts/check-update-manifest.ps1

      - name: Generate SBOM
        shell: pwsh
        run: ./scripts/write-sbom.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniMailDesktop-windows
          retention-days: 14
          path: |
            build/bin/OmniMailDesktop.exe
            build/installer/OmniMailDesktop-Setup-*.exe
            build/installer/OmniMailDesktop-Setup-*.exe.sha256
            build/installer/update-manifest.json
            build/installer/OmniMailDesktop-Setup-*.sbom.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: OmniMailDesktop-windows
          path: artifacts

      - name: Prepare release notes
        shell: pwsh
        run: ./scripts/write-release-notes.ps1 -Tag "${{ github.ref_name }}" -OutputPath release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OmniMail Desktop ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/**/OmniMailDesktop-Setup-*.exe
            artifacts/**/OmniMailDesktop-Setup-*.exe.sha256
            artifacts/**/update-manifest.json
            artifacts/**/OmniMailDesktop-Setup-*.sbom.json

      - name: Verify published release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/check-published-release.ps1 -Repository "${{ github.repository }}" -Tag "${{ github.ref_name }}"
